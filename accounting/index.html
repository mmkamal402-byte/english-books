*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Cairo,system-ui,sans-serif;overflow-x:clip;padding-bottom:96px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.top{background:var(--navy);color:#fff;padding:18px max(5vw,16px) 14px}
:root .top{background:#1f4e8c}
.top h1{margin:0;font-size:clamp(26px,5vw,38px);line-height:1.15;font-weight:800}
.top p{margin:4px 0 0;opacity:.9;font-size:15px}.top .by{font-weight:800;opacity:1;color:#ffd166}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.ctrl label{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:24px;padding:6px 14px;font-size:14px;font-weight:700}
.ctrl input[type=range]{width:110px;accent-color:#ffd166}
.tog{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:24px;padding:8px 16px;font-weight:700;font-size:14px;min-height:44px}
.tog.dictb{background:#ffd166;color:#1d2433}
.tog[aria-pressed=true]{background:#ffd166;color:#1d2433}
.secs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px max(5vw,16px);scrollbar-width:thin}
.secs button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:6px 14px;font-size:14px;font-weight:700;min-height:40px}
.secs button.on{background:var(--coral);border-color:var(--coral);color:#fff}

.sh small{display:block;direction:ltr;text-align:right;color:var(--teal);font-weight:700;font-size:14px}
.all{background:var(--teal);color:#fff;border:0;border-radius:26px;padding:10px 20px;font-weight:800;min-height:46px}

.card.play{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.n{position:absolute;top:10px;right:12px;font-size:13px;font-weight:800;color:var(--coral)}
.ar{font-size:clamp(20px,4.6vw,25px);font-weight:800;line-height:1.5;margin-top:6px}
.en{direction:ltr;font-size:clamp(18px,4.2vw,22px);font-weight:800;line-height:1.4}
.hide .en{filter:blur(7px);cursor:pointer}
.hide .card.shown .en{filter:none}
.chips{direction:ltr;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 12px}
.chip{border:1.5px solid;border-radius:10px;background:transparent;padding:3px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.3;min-height:44px;justify-content:center}
.chip b{font-size:14px}.chip i{font-style:normal;font-size:13px;color:var(--mut);direction:rtl}
.btns{display:flex;justify-content:center;gap:10px}
.pb{border:0;border-radius:24px;padding:8px 18px;font-weight:800;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.pb.n1{background:var(--navy);color:#fff}
:root .pb.n1{background:#1f4e8c}
.pb.n2{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.pb svg{width:16px;height:16px;fill:currentColor}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(4vw,12px) calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;z-index:9}
.bar.on{display:flex}
.bar span{flex:1;font-weight:700;font-size:14px}
.bar button{border:0;border-radius:22px;background:var(--coral);color:#fff;font-weight:800;padding:8px 18px;min-height:44px}
.warn{display:none;background:#fff3cd;color:#5c4400;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.views{display:flex;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:4px;margin-bottom:14px;width:max-content;max-width:100%}

.views button.on{background:var(--navy);color:#fff}
:root .views button.on{background:#1f4e8c}
.secs button.dict{border-color:var(--teal);color:var(--teal)}
.secs button.dict.on{background:var(--teal);color:#fff;border-color:var(--teal)}

.qt{font-size:13px;font-weight:800;color:var(--coral);margin-bottom:4px}
.qa{font-size:20px;font-weight:800;margin-bottom:10px}
.pool,.ansz{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;min-height:48px}

.qb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.fb{margin-top:8px;font-weight:800}.fb.ok{color:#1b8a6b}.fb.no{color:#d1495b}.fb span{direction:ltr;display:inline-block}

 for(let i=0;i<S.length&&!stopFlag;i++){mark(i);$('bt').textContent=`الجملة ${offs[cur]+i+1} من ${offs[cur]+S.length}`;
  for(let k=0;k<times&&!stopFlag;k++){await say('s',i);await wait(times>1&&k===0?600:1400)}}
 if(!stopFlag){mark(null);$('bar').classList.remove('on')}}
function hintsOf(words){const f=[];words.forEach(e=>(e.toLowerCase().match(/[a-z']+/g)||[]).forEach(w=>{if(X.pron[w]&&!f.some(x=>x[0]===w))f.push([w,X.pron[w]])}));return f.slice(0,3)}
const hintHtml=h=>h.length?`<div class="hint">🗣 النطق: ${h.map(x=>`<bdi dir="ltr">${esc(x[0])}</bdi> «${esc(x[1])}»`).join(' · ')}</div>`:'';
function renderLearn(){
 const c=D[cur];
 $('list').innerHTML=c.s.map((s,i)=>{const ch=s[1];
  const ar=s[2].map(j=>`<span style="color:${col(j)}">${esc(ch[j][1])}</span>`).join(' ')+(s[0]?'؟':'.');
  const en=ch.map((x,j)=>`<span style="color:${col(j)}">${esc(x[0])}</span>`).join(' ')+(s[0]?'?':'.');
  const chips=ch.map((x,j)=>`<button class="chip" data-w="${esc(x[0])}" style="border-color:${col(j)}"><b style="color:${col(j)}">${esc(x[0])}</b><i>${esc(x[1])}</i></button>`).join('');
  return `<article class="card" data-i="${i}"><span class="n">${offs[cur]+i+1}</span><div class="ar">${ar}</div><div class="en">${en}</div><div class="chips">${chips}</div>${hintHtml(hintsOf(ch.map(x=>x[0])))}
  <div class="btns"><button class="pb n1" data-p="${i}"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>استمع</button><button class="pb n2" data-s="${i}">🐢 ببطء</button></div></article>`}).join('');}
/* exercises */
let ES={};
const low=(w,first)=>first&&!/^I(\b|'|$)/.test(w)?w[0].toLowerCase()+w.slice(1):w;
const TL={order:'رتّب الكلمات',tr:'اختار الترجمة الصح',fill:'اختار الكلمة الصح'};
function renderEx(){
 const Q=X.ex[cur];ES={done:{},ok:0,pick:{}};
 $('list').innerHTML=`<div class="score"><span id="sc">النتيجة: 0 / 10</span><button id="redo">أعد التمارين</button></div>`+Q.map((q,n)=>{
  let b='';
  if(q.t==='order'){b=`<div class="ansz" id="az${n}"></div><div class="pool" id="pl${n}">${q.parts.map((w,k)=>`<button class="w" data-q="${n}" data-k="${k}">${esc(w===q.ans[0]?low(w,true):w)}</button>`).join('')}</div>
   <div class="qb"><button data-chk="${n}">تحقق</button><button class="sec2" data-clr="${n}">مسح</button></div>`}
  else if(q.t==='tr'){b=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-q="${n}" data-o="${k}">${esc(o)}</button>`).join('')}</div>`}
  else{b=`<div class="blank">${q.words.map((w,k)=>k===q.k?'<u>____</u>':esc(w)).join(' ')}${q.q?'?':'.'}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-q="${n}" data-o="${k}">${esc(o)}</button>`).join('')}</div>`}
  return `<div class="q" id="q${n}"><div class="qt">${n+1}. ${TL[q.t]}</div><div class="qa">${esc(q.ar)}</div>${b}<div class="fb" id="fb${n}"></div></div>`}).join('');}
function finish(n,ok){const q=X.ex[cur][n];if(ES.done[n])return;ES.done[n]=1;if(ok)ES.ok++;
 $('q'+n).classList.add(ok?'ok':'no');const right=D[cur].s[q.i][1].map(x=>x[0]).join(' ')+(D[cur].s[q.i][0]?'?':'.');
 $('fb'+n).className='fb '+(ok?'ok':'no');$('fb'+n).innerHTML=(ok?'✓ إجابة صحيحة! ':'✗ الإجابة الصحيحة: ')+`<span>${esc(right)}</span>`;
 $('sc').textContent=`النتيجة: ${ES.ok} / 10`+(Object.keys(ES.done).length===10?(ES.ok>=8?' — ممتاز!':' — راجع القسم وجرّب تاني'):'');
 stop();stopFlag=false;say('s',q.i)}
function exClick(e){
 const t=e.target;if(t.id==='redo'){renderEx();return}
 const w=t.closest('.w');if(w){const n=+w.dataset.q;if(ES.done[n])return;const az=$('az'+n),pl=$('pl'+n);
  if(w.parentElement===pl){const c=w.cloneNode(true);c.dataset.from=w.dataset.k;w.classList.add('used');az.appendChild(c)}
  else{pl.querySelector(`[data-k="${w.dataset.from}"]`).classList.remove('used');w.remove()}return}
 const chk=t.closest('[data-chk]');if(chk){const n=+chk.dataset.chk,q=X.ex[cur][n];const got=[...$('az'+n).children].map(c=>q.parts[+c.dataset.from]);
  if(got.length<q.parts.length)return;finish(n,got.join('|')===q.ans.join('|'));return}
 const clr=t.closest('[data-clr]');if(clr){const n=+clr.dataset.clr;if(ES.done[n])return;$('az'+n).innerHTML='';$('pl'+n).querySelectorAll('.w').forEach(x=>x.classList.remove('used'));return}
 const o=t.closest('.opt');if(o){const n=+o.dataset.q,q=X.ex[cur][n];if(ES.done[n])return;const k=+o.dataset.o;
  $('q'+n).querySelectorAll('.opt').forEach((b,j)=>{if(j===q.ans)b.classList.add('right');else if(j===k)b.classList.add('wrong')});finish(n,k===q.ans)}}
/* dictionary */
function renderDict(){
 $('st').textContent='القاموس';$('se').textContent=`${X.gloss.length} كلمة وعبارة مرتبة أبجديًا`;
 $('list').innerHTML=`<input class="srch" id="srch" type="search" placeholder="ابحث بالإنجليزي أو بالعربي…" autocomplete="off"><div id="dl"></div>`;
 const draw=f=>{let last='',h='';X.gloss.forEach((g,i)=>{if(f&&!(g[0].toLowerCase().includes(f)||g[1].includes(f)))return;
   const L=g[0].replace(/^(a|an|the)\s+/i,'')[0].toUpperCase();if(L!==last){last=L;h+=`<div class="lt">${esc(L)}</div>`}
   const hn=hintsOf([g[0]]);h+=`<div class="dr"><div class="e">${esc(g[0])}${hn.length?`<small>«${esc(hn.map(x=>x[1]).join(' '))}»</small>`:''}</div><div class="a">${esc(g[1])}</div><button data-g="${i}" aria-label="استمع">🔊</button></div>`});
  $('dl').innerHTML=h||'<p class="note">لا توجد نتائج</p>'};
 draw('');$('srch').addEventListener('input',e=>draw(e.target.value.trim().toLowerCase()));}
function render(){
 stop();load(cur).catch(()=>{});const dict=mode==='dict';
 $('views').style.display=dict?'none':'flex';$('all').style.display=mode==='learn'?'':'none';
 document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===mode));
 document.querySelectorAll('#secs button').forEach(b=>b.classList.toggle('on',dict?b.dataset.d!=null:+b.dataset.c===cur&&b.dataset.d==null));
 if(dict){renderDict();return}
 $('st').textContent=`${cur+1}. ${D[cur].a}`;$('se').textContent=D[cur].e+(mode==='ex'?' — Review':'');
 mode==='ex'?renderEx():renderLearn();
 try{localStorage.setItem('jb2-sec',cur)}catch(e){}}
$('secs').innerHTML='<button class="dict" data-d="1">📖 القاموس</button>'+D.map((c,i)=>`<button data-c="${i}">${i+1}. ${esc(c.a)}</button>`).join('');
$('secs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d!=null)mode='dict';else{cur=+b.dataset.c;if(mode==='dict')mode='learn'}render();b.scrollIntoView({inline:'center',block:'nearest'});window.scrollTo({top:0})});
$('dictb').addEventListener('click',()=>{mode='dict';render();window.scrollTo({top:0});const b=document.querySelector('#secs .dict');b&&b.scrollIntoView({inline:'center',block:'nearest'})});
$('views').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.v;render()});
$('list').addEventListener('click',e=>{
 if(mode==='ex'){exClick(e);return}
 if(mode==='dict'){const g=e.target.closest('[data-g]');if(g){const x=X.gloss[+g.dataset.g];stop();stopFlag=false;say('w',x[0],null,x[2])}return}
 const p=e.target.closest('[data-p]'),s=e.target.closest('[data-s]'),w=e.target.closest('.chip'),en=e.target.closest('.en');
 if(p)playOne(+p.dataset.p);else if(s)playOne(+s.dataset.s,0.7);else if(w){stop();stopFlag=false;say('w',w.dataset.w)}
 else if(en&&document.body.classList.contains('hide'))en.closest('.card').classList.add('shown')});
$('all').addEventListener('click',playAll);$('stop').addEventListener('click',stop);
$('rate').addEventListener('input',e=>$('rv').textContent=e.target.value);
$('hide').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);document.body.classList.toggle('hide',on);document.querySelectorAll('.card.shown').forEach(c=>c.classList.remove('shown'))});
$('rep').addEventListener('click',e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')});
try{const v=+localStorage.getItem('jb2-sec');if(v>=0&&v<D.length)cur=v}catch(e){}
function route(){const h=location.hash;let m,target=null;
 if(m=h.match(/^#s(\d+)$/)){const c=+m[1]-1;if(c>=0&&c<D.length){cur=c;mode='learn'}}
 else if(m=h.match(/^#ex(\d+)$/)){const c=+m[1]-1;if(c>=0&&c<D.length){cur=c;mode='ex'}}
 else if(h==='#dict')mode='dict';
 else if(m=h.match(/^#j(\d+)$/)){const n=+m[1]-1;mode='learn';for(let c=D.length-1;c>=0;c--){if(n>=offs[c]){if(n-offs[c]<D[c].s.length){cur=c;target=n-offs[c]}break}}}
 render();const b=document.querySelector(mode==='dict'?'#secs .dict':`#secs button[data-c="${cur}"]`);b&&b.scrollIntoView({inline:'center',block:'nearest'});
 if(target!=null){const el=document.querySelector(`.card[data-i="${target}"]`);if(el){el.scrollIntoView({block:'center'});el.classList.add('play');setTimeout(()=>el.classList.remove('play'),2500)}}}
addEventListener('hashchange',route);route();
}
</script></body></html>
