<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="المحاسبة بالإنجليزي">
<title>اتعلم المحاسبة بالإنجليزي مع محمد كمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly study companion, calm and clear
   IDEA: the printed booklet, now with a voice
   PICTURE: the sentence card itself, large play buttons
   COLOUR and TYPE: navy #1f4e8c, teal #1b8a6b, coral #d1495b on white; Cairo
   LAYOUT: sticky section strip, one column of cards, bottom player bar */
:root{color-scheme:light dark;--bg:light-dark(#f6f7fb,#0f1522);--card:light-dark(#fff,#18213a);--ink:light-dark(#1d2433,#e8ecf5);--mut:light-dark(#69748a,#9aa6bf);--line:light-dark(#e0e4ee,#2a3554);--navy:light-dark(#1f4e8c,#7fb0f0);--teal:light-dark(#1b8a6b,#4fd1a8);--coral:#d1495b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Cairo,system-ui,sans-serif;overflow-x:clip;padding-bottom:96px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.top{background:var(--navy);color:#fff;padding:18px max(5vw,16px) 14px}
:root .top{background:#1f4e8c}
.top h1{margin:0;font-size:clamp(26px,5vw,38px);line-height:1.15;font-weight:800}
.top p{margin:4px 0 0;opacity:.9;font-size:15px}.top .by{font-weight:800;opacity:1;color:#ffd166}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.ctrl label{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:24px;padding:6px 14px;font-size:14px;font-weight:700}
.ctrl input[type=range]{width:110px;accent-color:#ffd166}
.tog{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:24px;padding:8px 16px;font-weight:700;font-size:14px;min-height:44px}
.tog.dictb{background:#ffd166;color:#1d2433}
.tog[aria-pressed=true]{background:#ffd166;color:#1d2433}
.secs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px max(5vw,16px);scrollbar-width:thin}
.secs button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:6px 14px;font-size:14px;font-weight:700;min-height:40px}
.secs button.on{background:var(--coral);border-color:var(--coral);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px max(4vw,12px)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.sh h2{margin:0;font-size:24px;color:var(--navy);font-weight:800}
.sh small{display:block;direction:ltr;text-align:right;color:var(--teal);font-weight:700;font-size:14px}
.all{background:var(--teal);color:#fff;border:0;border-radius:26px;padding:10px 20px;font-weight:800;min-height:46px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 14px 14px;margin-bottom:12px;text-align:center;position:relative;transition:border-color .2s,box-shadow .2s}
.card.play{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.n{position:absolute;top:10px;right:12px;font-size:13px;font-weight:800;color:var(--coral)}
.ar{font-size:clamp(20px,4.6vw,25px);font-weight:800;line-height:1.5;margin-top:6px}
.en{direction:ltr;font-size:clamp(18px,4.2vw,22px);font-weight:800;line-height:1.4}
.hide .en{filter:blur(7px);cursor:pointer}
.hide .card.shown .en{filter:none}
.chips{direction:ltr;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 12px}
.chip{border:1.5px solid;border-radius:10px;background:transparent;padding:3px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.3;min-height:44px;justify-content:center}
.chip b{font-size:14px}.chip i{font-style:normal;font-size:13px;color:var(--mut);direction:rtl}
.btns{display:flex;justify-content:center;gap:10px}
.pb{border:0;border-radius:24px;padding:8px 18px;font-weight:800;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.pb.n1{background:var(--navy);color:#fff}
:root .pb.n1{background:#1f4e8c}
.pb.n2{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.pb svg{width:16px;height:16px;fill:currentColor}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(4vw,12px) calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;z-index:9}
.bar.on{display:flex}
.bar span{flex:1;font-weight:700;font-size:14px}
.bar button{border:0;border-radius:22px;background:var(--coral);color:#fff;font-weight:800;padding:8px 18px;min-height:44px}
.warn{display:none;background:#fff3cd;color:#5c4400;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.views{display:flex;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:4px;margin-bottom:14px;width:max-content;max-width:100%}
.views button{border:0;background:transparent;color:var(--ink);border-radius:22px;padding:6px 18px;font-weight:800;min-height:40px}
.views button.on{background:var(--navy);color:#fff}
:root .views button.on{background:#1f4e8c}
.secs button.dict{border-color:var(--teal);color:var(--teal)}
.secs button.dict.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 10px;direction:rtl}.hint bdi{font-weight:800;color:var(--ink)}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.q.ok{border-color:#1b8a6b}.q.no{border-color:#d1495b}
.qt{font-size:13px;font-weight:800;color:var(--coral);margin-bottom:4px}
.qa{font-size:20px;font-weight:800;margin-bottom:10px}
.pool,.ansz{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.ansz{border:2px dashed var(--line);border-radius:12px;padding:6px;margin-bottom:10px}
.w{border:1.5px solid var(--navy);color:var(--navy);background:transparent;border-radius:10px;padding:6px 12px;font-weight:700;min-height:44px}
.w.used{visibility:hidden}
.blank{direction:ltr;font-size:19px;font-weight:800;margin-bottom:10px}.blank u{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--coral);text-decoration:none;color:var(--coral)}
.opts{display:grid;gap:8px}
.opt{direction:ltr;text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;min-height:46px}
.opt.right{border-color:#1b8a6b;background:color-mix(in srgb,#1b8a6b 15%,transparent)}
.opt.wrong{border-color:#d1495b;background:color-mix(in srgb,#d1495b 14%,transparent)}
.qb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qb button{border:0;border-radius:22px;padding:8px 18px;font-weight:800;min-height:44px;background:var(--navy);color:#fff}
.qb .sec2{background:transparent;color:var(--mut);border:1.5px solid var(--line)}
.fb{margin-top:8px;font-weight:800}.fb.ok{color:#1b8a6b}.fb.no{color:#d1495b}.fb span{direction:ltr;display:inline-block}
.score{position:sticky;top:62px;z-index:4;background:var(--teal);color:#fff;border-radius:14px;padding:10px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.score button{border:0;background:#fff;color:#1b8a6b;border-radius:20px;padding:6px 14px;font-weight:800;min-height:40px}
.srch{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px}
.lt{font-size:20px;font-weight:800;color:var(--coral);margin:14px 4px 6px;direction:ltr;text-align:left}
.dr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:10px;align-items:center;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px}
.dr .e{direction:ltr;text-align:left;font-weight:800;color:var(--navy)}.dr .a{font-weight:700}.dr small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.dr button{border:0;background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal);border-radius:50%;width:40px;height:40px;font-size:15px}
.note{color:var(--mut);font-size:13px;text-align:center;margin:20px 0}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

:root{--fz:1}
.card .ar{font-size:calc(clamp(20px,4.6vw,25px)*var(--fz))}.card .en{font-size:calc(clamp(18px,4.2vw,22px)*var(--fz))}.chip b{font-size:calc(14px*var(--fz))}.chip i{font-size:calc(13px*var(--fz))}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.stats span{background:rgba(255,255,255,.16);border-radius:16px;padding:3px 12px;font-weight:700;font-size:14px}
.tog.act{outline:3px solid #fff}
.fz{display:inline-flex;gap:6px}
.btns{flex-wrap:wrap}.btns.sm{margin-top:8px}.btns.sm .pb{font-size:14px;min-height:38px;padding:6px 14px}
.pb.n3{background:#d1495b;color:#fff}
.pb.tg{background:transparent;border:1.5px solid var(--line);color:var(--mut)}.pb.tg.on{background:#1b8a6b;border-color:#1b8a6b;color:#fff}.pb.tg.hd.on{background:#c77d00;border-color:#c77d00}
.card.done{border-color:color-mix(in srgb,#1b8a6b 55%,var(--line))}
.sec-t{display:inline-block;font-size:12px;font-weight:800;color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent);border-radius:10px;padding:1px 10px;margin-bottom:4px}
.mic{margin-top:10px;background:color-mix(in srgb,var(--navy) 7%,transparent);border-radius:12px;padding:10px;font-size:15px}
.mic .rec{color:#d1495b;animation:bl 1s infinite}@keyframes bl{50%{opacity:.4}}@media (prefers-reduced-motion:reduce){.mic .rec{animation:none}}
.mres{display:grid;gap:6px;justify-items:center}.mres b.g{color:#1b8a6b}.mres b.o{color:#c77d00}.mres b.r{color:#d1495b}
.mw{font-size:19px;font-weight:800}.mw .ok{color:#1b8a6b}.mw .no{color:#d1495b;text-decoration:underline wavy}
.mres small{color:var(--mut)}
.pg{display:flex;align-items:center;gap:10px;margin:-4px 0 14px;font-size:14px;font-weight:700;color:var(--mut)}.pgb{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}.pgb i{display:block;height:100%;background:#1b8a6b}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;font-size:16px;line-height:1.8}
.lhelp{color:var(--mut);font-size:14px;margin:6px 0 10px}
.opt.ar-o{direction:rtl;text-align:right;font-size:17px}
.rv .ar{margin:8px 0}.pb.ok{background:#1b8a6b;color:#fff}.pb.bad{background:#d1495b;color:#fff}
.secs button em{font-style:normal;color:var(--teal);font-size:12px}.secs button.on em{color:#fff}
[hidden]{display:none!important}

.cds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.cdb{border:2px solid var(--line);border-radius:12px;background:transparent;padding:4px;color:var(--ink);font-weight:800;font-size:13px}.cdb img{width:100%;border-radius:8px;display:block}.cdb.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}

.views{flex-wrap:wrap;width:auto;border-radius:18px;justify-content:center}
.syn{direction:ltr;font-size:13px;color:var(--mut);margin:-4px 0 10px;display:flex;flex-direction:column;gap:2px}.syn b{color:var(--ink)}.syn i{font-style:normal;direction:rtl;unicode-bidi:isolate}
.xr{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;text-align:center;background:var(--card);transition:border-color .2s}
.xr.play{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.xl{display:inline-block;font-size:12px;font-weight:800;color:var(--coral);margin-bottom:2px}
.xar{font-weight:800;font-size:calc(18px*var(--fz,1));line-height:1.5}
.xen{direction:ltr;font-weight:800;font-size:calc(17px*var(--fz,1));color:var(--navy)}
.hide .xen{filter:blur(7px);cursor:pointer}.hide .xr.shown .xen{filter:none}
.xb{display:flex;gap:6px;justify-content:center;margin-top:6px}.pb.xs{min-height:38px;padding:4px 14px;font-size:14px}
.chip.on{background:color-mix(in srgb,var(--teal) 14%,transparent);box-shadow:0 0 0 2px var(--teal)}
.dlg{display:flex;flex-direction:column}.bub{max-width:88%;position:relative}.bub.a{align-self:flex-start}.bub.b{align-self:flex-end;background:color-mix(in srgb,var(--navy) 7%,var(--card))}
.bub .who{position:absolute;top:-9px;inset-inline-start:10px;background:var(--navy);color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:0 8px}
.bub.mine .who{background:var(--coral)}.bub.rp .xen{filter:blur(7px)}
.dlb{flex-wrap:wrap}
details.scen summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}details.scen summary::-webkit-details-marker{display:none}details.scen summary small{color:var(--mut);text-align:left}
details.scen summary b{font-size:17px}details.scen summary::after{content:'▾ افتح';font-size:12px;color:var(--teal);font-weight:800}details.scen[open] summary::after{content:'▴ اقفل'}
.tr{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;flex-wrap:wrap}.tr small{color:var(--mut)}
.me label{display:block;font-weight:800;margin-bottom:8px}.me .srch{margin-top:4px;width:100%;box-sizing:border-box}.me .two{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:-4px 0 8px}select.srch{background:var(--card);color:var(--ink)}
.shd{background:var(--navy);color:#fff;border:0;border-radius:26px;padding:10px 16px;font-weight:800;min-height:46px}

.lvc .lvh{display:flex;justify-content:space-between;align-items:center;font-size:18px}.lvc.ok{border-color:#1b8a6b}.pass{background:#1b8a6b;color:#fff;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:800}.qb .ok2{background:#c99a35;color:#fff}
.nudge{background:color-mix(in srgb,#ffc857 25%,var(--card));border:1.5px solid #ffc857;border-radius:16px;padding:12px 14px;margin-bottom:12px;line-height:1.6}
.lvd{flex:none;align-self:center;font-size:20px;padding:0 2px}
.top{position:relative;padding:16px max(5vw,16px) 12px}.top>p:not(.by){display:none}
.setb{position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);font-size:22px;color:#fff}
.setb[aria-expanded=true]{background:#ffd166}
.stats{gap:6px;margin-top:8px}.stats span{font-size:13px;padding:2px 10px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.tiles button{position:relative;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;line-height:1.2}

 if(!out.length)return '';

/* generic mic for any text */
function micText(box,target){return new Promise(res=>{box.hidden=false;
 if(!SR){box.innerHTML='الميكروفون مش مدعوم هنا. جرّب Safari على الآيفون أو Chrome على الأندرويد.';res(null);return}
 stop();try{recog&&recog.abort()}catch(e){}
 const tw=norm(target);const r=new SR();recog=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=4;let got=false;
 box.innerHTML='<b class="rec">● بسمعك… قول الجملة بالإنجليزي</b>';
 r.onresult=ev=>{got=true;let best=null;for(const alt of ev.results[0]){const hw=norm(alt.transcript),hit=lcs(tw,hw),sc=hit.filter(Boolean).length/tw.length;if(!best||sc>best.sc)best={sc,hit,t:alt.transcript}}
  const pct=Math.round(best.sc*100);const words=target.replace(/[.?!]$/,'').split(' ');let k=0;
  const colored=words.map(w=>{const parts=norm(w);const ok=parts.every(()=>best.hit[k++]);return `<span class="${ok?'ok':'no'}">${esc(w)}</span>`}).join(' ');
  box.innerHTML=`<div class="mres"><b class="${pct>=85?'g':pct>=60?'o':'r'}">${pct}% — ${pct>=85?'ممتاز! 👏':pct>=60?'كويس، قرّبت':'حاول تاني ببطء'}</b><div class="mw" dir="ltr">${colored}</div><small>سمعتك: <bdi dir="ltr">${esc(best.t)}</bdi></small></div>`;touch();res(pct)};
 r.onerror=ev=>{got=true;box.innerHTML=ev.error==='not-allowed'||ev.error==='service-not-allowed'?'اسمح للصفحة تستخدم الميكروفون من إعدادات المتصفح.':'ما سمعتش حاجة. جرّب تاني.';res(null)};
 r.onend=()=>{if(!got){box.innerHTML='ما سمعتش حاجة. جرّب تاني.';res(null)}};
 try{r.start()}catch(e){box.textContent='مش قادر أشغّل الميكروفون.';res(null)}})}

function PZe(s,V){if(typeof s!=='string')return s;
 s=s.replace(/\bMohamed( Kamal)?\b/g,V.ne).replace(/\bEgypt\b/g,V.fe).replace(/\bKuwait\b/g,V.le);
 if(s==='an accountant')return V.art+' '+V.je;s=s.replace(JF,(m,a)=>`${a} ${V.art} ${V.je}`);
 if(s==='forty')return V.aw;return s.replace(AF,V.aw+' years old')}
function PZa(s,V,jf,af){if(typeof s!=='string')return s;
 s=s.replace(/محمد( كمال)?/g,V.na).replace(/مصر/g,V.fa).replace(/الكويت(?!ي)/g,V.la);
 if(jf||s==='محاسب')s=s.replace(/محاسباً|محاسب(?![ةيوا])/g,V.ja);
 if(af||s==='أربعون')s=s.replace(/أربعون/g,V.aa);return s}

  const ch=s[1].map(x=>[PZe(x[0],V),PZa(x[1],V,jf,af)]);D[ci].s[i][1]=ch;if(ch.map(x=>x[0]).join(' ')!==en)CHG.add(gid(ci,i))}));
 const pp=p=>{const jf=JF.test(p[0]),af=AF.test(p[0]);return [PZe(p[0],V),PZa(p[1],V,jf,af)].concat(p.slice(2))};
 MX0.secs.forEach((c,ci)=>{const T=MX.secs[ci];T.sub=c.sub.map(x=>({base:x.base,opts:x.opts.map(pp)}));T.tr=c.tr.map(t=>t.map(pp));T.dl=c.dl.map(pp)});
 MX0.scen.forEach((c,k)=>{MX.scen[k].l=c.l.map(pp)});
 EX0.forEach((Q,ci)=>Q.forEach((q,n)=>{const en=D0[ci].s[q.i][1].map(x=>x[0]).join(' '),jf=JF.test(en),af=AF.test(en);const o=JSON.parse(JSON.stringify(q));
  o.ar=PZa(q.ar,V,jf,af);['parts','ans','words','opts'].forEach(k=>{if(Array.isArray(q[k]))o[k]=q[k].map(x=>PZe(x,V))});X.ex[ci][n]=o}))}
